<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>To-do list</title>
		<link rel="stylesheet" href="./css/style.min.css" />
		<script
			src="https://kit.fontawesome.com/bec11fab24.js"
			crossorigin="anonymous"
		></script>
	</head>
	<body>
		<h1 class="title">To-Do List</h1>
		<blockquote>
			<p>"Organise your tasks today - manage your success tomorrow."</p>
		</blockquote>

		<div class="todo">
			<div class="todo__wrapper">
				<input type="text" class="todo__enter" placeholder="Add your task" />
				<button class="todo__btn">Add</button>
			</div>

			<div class="todo__tasks"></div>
		</div>

		<script src="./index.js"></script>
	</body>
</html>
